<!doctype html>
<!-- Sursa imaginii assets/og.png (Open Graph, 1200×630), în paleta v4: negru, grafit, argint.
     Lumina rece din spatele cuvântului CALEA imită razele din hero. Randare: ONLY="og" bash art/render.sh -->
<html lang="ro">
<head>
<meta charset="utf-8">
<title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,300..600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #070708; color: #e6e8eb; }
  .rays { position: absolute; inset: 0; }
  .c { position: absolute; inset: 0; padding: 54px 64px; display: flex; flex-direction: column; justify-content: space-between; font-family: "Archivo", sans-serif; }
  .top { display: flex; justify-content: space-between; font-family: "Martian Mono", monospace; font-stretch: 87.5%; font-size: 18px; color: #9aa0a8; }
  .wm {
    display: flex; justify-content: space-between; font-weight: 900; font-stretch: 125%; font-size: 232px; line-height: 0.8; margin: 0 -8px;
    background: linear-gradient(180deg, #f3f5f7 0%, #c3c8cf 34%, #6d737b 50%, #3b3f45 53%, #868c94 66%, #cfd3d9 84%, #f0f2f4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .bot { display: flex; justify-content: space-between; align-items: end; border-top: 1px solid rgba(200,210,225,.22); padding-top: 18px; }
  .name { font-size: 44px; font-weight: 700; font-stretch: 106%; letter-spacing: -1.2px; line-height: 1; }
  .meta { font-family: "Martian Mono", monospace; font-stretch: 87.5%; font-size: 17px; color: #9aa0a8; text-align: right; line-height: 1.6; }
</style>
</head>
<body>
<svg class="rays" width="1200" height="630" id="rays"></svg>
<div class="c">
  <div class="top"><span>deniscalea.github.io</span><span>Cluj-Napoca</span></div>
  <div class="wm"><span>C</span><span>A</span><span>L</span><span>E</span><span>A</span></div>
  <div class="bot">
    <div class="name">Denis-Alexandru Călin</div>
    <div class="meta">Calculatoare, UTCN, anul 2<br>VHDL / FPGA / C++ / Java</div>
  </div>
</div>
<script>
(function () {
  /* raze: triunghiuri subțiri care pleacă din spatele cuvântului, estompate cu blur */
  var s = 11, o = '<defs><filter id="b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>' +
    '<radialGradient id="g" cx="600" cy="300" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#dfe6ef" stop-opacity=".5"/><stop offset=".35" stop-color="#9fa8b4" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>' +
    '<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/><feColorMatrix type="saturate" values="0"/></filter></defs>';
  function r() { s = (s * 16807) % 2147483647; return s / 2147483647; }
  o += '<g filter="url(#b)" fill="url(#g)">';
  for (var i = 0; i < 70; i++) {
    var a = r() * Math.PI * 2, w = 0.006 + r() * 0.03, L = 700;
    var x1 = 600 + Math.cos(a - w) * L, y1 = 300 + Math.sin(a - w) * L, x2 = 600 + Math.cos(a + w) * L, y2 = 300 + Math.sin(a + w) * L;
    o += '<polygon points="600,300 ' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1) + '" opacity="' + (0.25 + r() * 0.75).toFixed(2) + '"/>';
  }
  o += '</g><ellipse cx="600" cy="300" rx="430" ry="150" fill="#cfd8e3" opacity=".05" filter="url(#b)"/>';
  o += '<rect width="1200" height="630" filter="url(#n)" opacity="0.07" style="mix-blend-mode:screen"/>';
  document.getElementById('rays').innerHTML = o;
})();
</script>
</body>
</html>
