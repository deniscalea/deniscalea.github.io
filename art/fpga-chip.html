<!doctype html>
<!-- Sursa imaginii assets/img/fpga-chip.webp: „macro render” izometric al cipului FPGA.
     Totul e generat aici, în SVG, cu un RNG cu seed. Randare: bash art/render.sh -->
<html lang="ro">
<head>
<meta charset="utf-8">
<title>fpga-chip</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,300..600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; }
  svg { display: block; width: 1600px; height: 1200px; }
  .mono { font-family: "Martian Mono", monospace; font-stretch: 87.5%; }
  .sans { font-family: "Archivo", sans-serif; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200"></svg>
<script>
(function () {
  var W = 1600, H = 1200, OX = 820, OY = 560;
  var seed = 7;
  function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  /* proiecție izometrică: x spre dreapta-jos, y spre stânga-jos, z în sus */
  function P(x, y, z) { return [OX + (x - y) * 0.866, OY + (x + y) * 0.5 - (z || 0)]; }
  function pts(arr) { return arr.map(function (p) { var q = P(p[0], p[1], p[2]); return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rot(p, k) { var x = p[0], y = p[1]; for (var i = 0; i < k; i++) { var t = x; x = -y; y = t; } return [x, y, p[2] || 0]; }

  var board = [], hot = [], comps = [], front = [], back = [], labels = [];

  /* grilă fină pe placă */
  for (var g = -1100; g <= 1100; g += 44) {
    board.push('<polyline points="' + pts([[g, -1100], [g, 1100]]) + '" stroke="#fff" stroke-opacity="0.035" fill="none"/>');
    board.push('<polyline points="' + pts([[-1100, g], [1100, g]]) + '" stroke="#fff" stroke-opacity="0.035" fill="none"/>');
  }

  /* fan-out din pini: drept, 45°, apoi drept spre margine */
  var HALF = 150, PIN = 26, PITCH = 10.6;
  function via(x, y, r, op) {
    var c = []; for (var i = 0; i < 18; i++) { var a = i / 18 * Math.PI * 2; c.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); }
    return '<polygon points="' + pts(c) + '" fill="#000" stroke="#fff" stroke-opacity="' + op + '" stroke-width="1.4"/>';
  }
  for (var side = 0; side < 4; side++) {
    for (var i = 0; i < PIN; i++) {
      var t = (i - (PIN - 1) / 2) * PITCH;
      var x0 = HALF + 20, a = 18 + rnd() * 10, s = t < 0 ? -1 : 1, lat = Math.abs(t) * 1.15;
      var len = 140 + rnd() * 520 + (Math.abs(t) < 40 ? 220 : 0);
      var path = [[x0, t], [x0 + a, t], [x0 + a + lat, t + s * lat], [x0 + a + lat + len, t + s * lat]];
      var turn = rnd();
      if (turn < 0.35) { var l2 = 60 + rnd() * 160; var e = path[3]; path.push([e[0] + l2, e[1] + s * l2]); path.push([e[0] + l2 + 300, e[1] + s * l2]); }
      var rp = path.map(function (p) { return rot(p, side); });
      var op = (0.28 + rnd() * 0.32).toFixed(2);
      board.push('<polyline points="' + pts(rp) + '" fill="none" stroke="#fff" stroke-opacity="' + op + '" stroke-width="1.6" stroke-linejoin="round"/>');
      var end = rp[rp.length - 1];
      if (turn > 0.55 && turn < 0.8) board.push(via(end[0], end[1], 5.5, 0.6));
      /* câteva trasee „aprinse”: semnal care circulă */
      if (rnd() < 0.09) {
        var k = 1 + Math.floor(rnd() * (rp.length - 2));
        var A = rp[k], B = rp[k + 1], f0 = rnd() * 0.5, f1 = f0 + 0.18 + rnd() * 0.25;
        var pa = [A[0] + (B[0] - A[0]) * f0, A[1] + (B[1] - A[1]) * f0], pb = [A[0] + (B[0] - A[0]) * f1, A[1] + (B[1] - A[1]) * f1];
        hot.push('<polyline points="' + pts([pa, pb]) + '" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>');
      }
    }
  }
  /* vias împrăștiate */
  for (var v = 0; v < 70; v++) {
    var vx = (rnd() - 0.5) * 1700, vy = (rnd() - 0.5) * 1700;
    if (Math.abs(vx) < 260 && Math.abs(vy) < 260) continue;
    board.push(via(vx, vy, 3 + rnd() * 3, (0.15 + rnd() * 0.3).toFixed(2)));
  }

  /* componente SMD mici, cu înălțime */
  function box(x, y, w, d, h, top, label) {
    var x1 = x + w, y1 = y + d, out = '';
    out += '<polygon points="' + pts([[x1, y, 0], [x1, y1, 0], [x1, y1, h], [x1, y, h]]) + '" fill="#0b0b0b" stroke="#fff" stroke-opacity="0.18"/>';
    out += '<polygon points="' + pts([[x, y1, 0], [x1, y1, 0], [x1, y1, h], [x, y1, h]]) + '" fill="#151515" stroke="#fff" stroke-opacity="0.18"/>';
    out += '<polygon points="' + pts([[x, y, h], [x1, y, h], [x1, y1, h], [x, y1, h]]) + '" fill="' + (top || '#1d1d1d') + '" stroke="#fff" stroke-opacity="0.35"/>';
    return out;
  }
  var capSpots = [[-235, -200], [210, -240], [-240, 205], [228, 190], [-260, 40], [250, -40], [40, 255], [-30, -265]];
  capSpots.forEach(function (c) { comps.push(box(c[0], c[1], 22, 12, 7, '#2a2a2a')); });
  comps.push(box(-420, -330, 78, 50, 16, '#1a1a1a'));

  /* etichete de silkscreen: porturile reale din TOPMODULE.vhd */
  function silk(x, y, txt, size, op, z) {
    var p = P(x, y, z || 0);
    return '<text class="mono" font-size="' + size + '" fill="#fff" fill-opacity="' + op + '" transform="matrix(0.866 0.5 -0.866 0.5 ' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ')">' + txt + '</text>';
  }
  labels.push(silk(-420, -345, 'CLK 100 MHz', 15, 0.5));
  labels.push(silk(330, -300, 'LED_SEMNAL', 14, 0.42));
  labels.push(silk(330, -280, 'LED_FAULT', 14, 0.42));
  labels.push(silk(300, 330, 'AN[7:0]  SEG[6:0]', 14, 0.42));
  labels.push(silk(-560, 300, 'START  REACT  SKIP', 14, 0.38));
  labels.push(silk(-560, 322, 'BTNL  RST', 14, 0.38));
  labels.push(silk(-200, -190, 'U14', 12, 0.4));

  /* cipul: pini (spate, corp, față) */
  var BODY = 142, ZT = 26;
  function pin(side, t) {
    var e = BODY, p = [[e - 2, t, 11], [e + 6, t, 11], [e + 11, t, 1], [e + 20, t, 1]].map(function (q) { var r = rot(q, side); return [r[0], r[1], q[2]]; });
    return '<polyline points="' + pts(p) + '" fill="none" stroke="#d9d9d9" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="square"/>' +
           '<polyline points="' + pts(p) + '" fill="none" stroke="#fff" stroke-width="0.8" stroke-opacity="0.9"/>';
  }
  for (var sd = 0; sd < 4; sd++) for (var j = 0; j < PIN; j++) {
    var tt = (j - (PIN - 1) / 2) * PITCH;
    (sd === 0 || sd === 1 ? front : back).push(pin(sd, tt));
  }
  var body = '';
  body += '<polygon points="' + pts([[BODY, -BODY, 0], [BODY, BODY, 0], [BODY, BODY, ZT], [BODY, -BODY, ZT]]) + '" fill="url(#sideR)"/>';
  body += '<polygon points="' + pts([[-BODY, BODY, 0], [BODY, BODY, 0], [BODY, BODY, ZT], [-BODY, BODY, ZT]]) + '" fill="url(#sideL)"/>';
  body += '<polygon points="' + pts([[-BODY, -BODY, ZT], [BODY, -BODY, ZT], [BODY, BODY, ZT], [-BODY, BODY, ZT]]) + '" fill="url(#top)" stroke="#fff" stroke-opacity="0.22"/>';
  body += '<polyline points="' + pts([[-BODY, BODY, ZT], [BODY, BODY, ZT], [BODY, -BODY, ZT]]) + '" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.2"/>';
  /* inel interior gravat + punctul pinului 1 */
  var r = 112;
  body += '<polygon points="' + pts([[-r, -r, ZT], [r, -r, ZT], [r, r, ZT], [-r, r, ZT]]) + '" fill="none" stroke="#fff" stroke-opacity="0.08"/>';
  var c = []; for (var q = 0; q < 24; q++) { var an = q / 24 * Math.PI * 2; c.push([-112 + Math.cos(an) * 9, -112 + Math.sin(an) * 9, ZT]); }
  body += '<polygon points="' + pts(c) + '" fill="#000" fill-opacity="0.6" stroke="#fff" stroke-opacity="0.25"/>';
  function chipText(x, y, txt, size, op, cls, extra) {
    var p = P(x, y, ZT);
    return '<text class="' + cls + '" font-size="' + size + '" fill="#fff" fill-opacity="' + op + '" ' + (extra || '') + ' transform="matrix(0.866 0.5 -0.866 0.5 ' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ')">' + txt + '</text>';
  }
  body += chipText(-100, -30, 'TOP_GAME', 29, 0.82, 'sans', 'font-weight="800" font-stretch="125%" letter-spacing="1"');
  body += chipText(-92, -4, 'VHDL / FSM', 15, 0.5, 'mono');
  body += chipText(-92, 60, '100 MHz', 13, 0.38, 'mono');
  body += chipText(36, 60, '2026', 13, 0.38, 'mono');

  var s = document.getElementById('s');
  s.innerHTML =
    '<defs>' +
      '<radialGradient id="bgG" cx="52%" cy="46%" r="70%"><stop offset="0" stop-color="#1b1b1b"/><stop offset="0.55" stop-color="#070707"/><stop offset="1" stop-color="#000"/></radialGradient>' +
      '<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2b2b"/><stop offset="0.45" stop-color="#151515"/><stop offset="0.62" stop-color="#202020"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>' +
      '<linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202020"/><stop offset="1" stop-color="#050505"/></linearGradient>' +
      '<linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>' +
      '<radialGradient id="focus" cx="51%" cy="47%" r="38%"><stop offset="0.35" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>' +
      '<mask id="sharp"><rect width="1600" height="1200" fill="url(#focus)"/></mask>' +
      '<filter id="blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.2"/></filter>' +
      '<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
      '<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>' +
      '<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer></filter>' +
      '<radialGradient id="light" cx="38%" cy="30%" r="45%"><stop offset="0" stop-color="#fff" stop-opacity="0.13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.85"/></radialGradient>' +
    '</defs>' +
    '<rect width="1600" height="1200" fill="url(#bgG)"/>' +
    '<g filter="url(#blur)">' + board.join('') + labels.join('') + comps.join('') + '</g>' +
    '<g mask="url(#sharp)">' + board.join('') + labels.join('') + comps.join('') + '</g>' +
    '<g filter="url(#glow)">' + hot.join('') + '</g>' +
    '<polygon points="' + pts([[-150, -150, 0], [190, -150, 0], [190, 190, 0], [-150, 190, 0]]) + '" fill="#000" opacity="0.85" filter="url(#shadow)"/>' +
    back.join('') + body + front.join('') +
    '<rect width="1600" height="1200" fill="url(#light)"/>' +
    '<rect width="1600" height="1200" fill="url(#vig)"/>' +
    '<rect width="1600" height="1200" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:screen"/>';
})();
</script>
</body>
</html>
